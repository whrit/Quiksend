name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Outputs let the image job run ONLY when a release was actually cut.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      # Pin release-please-action by SHA for supply chain security
      - uses: googleapis/release-please-action@e51a0852fb12c1e42d88bcd5dbc2b72662c96e3d
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Build + push web and worker images to GHCR on every release. Sign with cosign
  # using GitHub OIDC keyless signing (SLSA L3 provenance).
  release-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC token for cosign
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quiksend-web
            dockerfile: apps/web/Dockerfile
          - image: quiksend-worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7418c8a1a6dad1e1c1351ff8c

      - uses: docker/setup-buildx-action@4fd812986e6c8f30e2cda3675a10d5bac4212fb0

      - uses: docker/login-action@9780b0c442fbb1117ed129e7d7d4f7fac5185ccb
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install cosign for keyless signing
      - uses: sigstore/cosign-installer@dc72c7d630f67512bf189f6e6cc2b9f9f1fbf465

      - id: meta
        uses: docker/metadata-action@70db91ff463a2883458410c4f8912f2a2fb57468
        with:
          # metadata-action lowercases the image name (GHCR requires lowercase).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@5176660c9b1c65c38bf0d11d19d7d8ac1d8ba5c7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=oci

      # Sign image with cosign using GitHub OIDC (keyless)
      - name: Sign image with cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}

      # Generate and attach SBOM (Software Bill of Materials)
      - name: Generate SBOM
        uses: anchore/sbom-action@d94f46e4b415d7bfd0d592f9eba8d6b2b0342482
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.release-please.outputs.tag_name }}
          artifact-name: ${{ matrix.image }}-${{ needs.release-please.outputs.tag_name }}.sbom.spdx
          format: spdx-json
          upload-artifact: true

      # Scan image for vulnerabilities (trivy)
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@4b0491a3997cb93d7453340c0750148b4ebd2581
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.release-please.outputs.tag_name }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@8573b56e526b86c89ef341101cd22ef75587e2e95
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # Create release with SBOMs and rollback command
  finalize-release:
    needs: [release-please, release-images]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@a5ac7e51b41094c7418c8a1a6dad1e1c1351ff8c

      - name: Record rollback command in release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude "$TAG" 2>/dev/null || echo "v0.0.0")
          ROLLBACK_CMD="kubectl set image deployment/quiksend-web web=ghcr.io/\$OWNER/quiksend-web:${PREV_TAG}"
          
          gh release edit "$TAG" --notes "
          ## Rollback Command
          
          If this release requires rollback to the previous version:
          
          \`\`\`bash
          export OWNER=\$(git config --get remote.origin.url | cut -d'/' -f4)
          $ROLLBACK_CMD
          kubectl rollout status deployment/quiksend-web
          \`\`\`
          
          Replace \`deployment/quiksend-web\` with your actual deployment name/namespace.
          " || true
