# Standalone production Compose. Private Postgres, Caddy TLS ingress, no defaults.
# Usage:
#   cp .env.example .env
#   # Set required production secrets in .env:
#   #   QUIKSEND_DOMAIN (your domain, e.g., example.com — MUST match BETTER_AUTH_URL origin)
#   #   POSTGRES_PASSWORD (strong password for postgres superuser)
#   #   POSTGRES_MIGRATOR_PASSWORD (strong password for schema migrations, >= 32 chars, [A-Za-z0-9._~-])
#   #   POSTGRES_APP_PASSWORD (strong password for app runtime, >= 32 chars, [A-Za-z0-9._~-])
#   #   BETTER_AUTH_SECRET (>= 32 bytes)
#   #   BETTER_AUTH_URL (https://your-domain.com, MUST match QUIKSEND_DOMAIN)
#   #   NANGO_WEBHOOK_SECRET (from Nango dashboard)
#   #   MAILBOX_ENCRYPTION_KEY (32-byte base64)
#   #   UNSUBSCRIBE_TOKEN_SECRET (>= 32 bytes)
#   #   SMTP_HOST (smtp.provider.com)
#   #   SMTP_PORT (587 or 465)
#   # Optional:
#   #   SENTRY_DSN, POSTHOG_KEY
#   #   QUIKSEND_IMAGE_TAG (defaults to latest)
#   #   LOG_LEVEL (info, debug; defaults to info)
#
# Build and run migrations:
#   docker compose -f docker-compose.prod.yml build migrate
#   docker compose -f docker-compose.prod.yml run --rm migrate
#
# Start services:
#   docker compose -f docker-compose.prod.yml up -d

networks:
  # Private network for database — internal only, no external access
  db:
    driver: bridge
    internal: true

  # Public network — Caddy TLS ingress, reverse proxy to internal services
  public:
    driver: bridge

services:
  # Caddy TLS reverse proxy — automatic HTTPS via Let's Encrypt ACME
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: quiksend-caddy
    restart: on-failure:3
    networks:
      - public
    environment:
      QUIKSEND_DOMAIN: ${QUIKSEND_DOMAIN:?QUIKSEND_DOMAIN required in production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - quiksend-caddy-data:/data
      - quiksend-caddy-config:/config
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2019/config || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Private Postgres — accessible only to web/worker/migrate via the private 'db' network.
  postgres:
    image: pgvector/pgvector:pg17@sha256:dd467f03ca5c5581222490e5217e48a262864ccb659be559f8491bbafdc97da0
    container_name: quiksend-postgres-prod
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in production}
      POSTGRES_DB: quiksend
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD required in production}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required in production}
      POSTGRES_INITDB_ARGS: >-
        -c log_min_messages=WARNING
    networks:
      - db
    volumes:
      - quiksend-pgdata-prod:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quiksend"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database migration service — runs bundled migrate.js with schema owner role.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: quiksend-migrate
    networks:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://quiksend_migrator:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD required}@postgres:5432/quiksend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    profiles:
      - migrate

  # Web service — TanStack Start + Nitro (internal network, reverse proxied by Caddy).
  web:
    image: ghcr.io/whrit/quiksend-web:${QUIKSEND_IMAGE_TAG:-latest}
    container_name: quiksend-web
    restart: on-failure:3
    networks:
      - db
      - public
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://quiksend_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}@postgres:5432/quiksend
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL required in production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      UNSUBSCRIBE_TOKEN_SECRET: ${UNSUBSCRIBE_TOKEN_SECRET:?UNSUBSCRIBE_TOKEN_SECRET required}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
      NANGO_WEBHOOK_SECRET: ${NANGO_WEBHOOK_SECRET:?NANGO_WEBHOOK_SECRET required}
      MAILBOX_ENCRYPTION_KEY: ${MAILBOX_ENCRYPTION_KEY:?MAILBOX_ENCRYPTION_KEY required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST required in production}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT required in production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      # Optional — AI generation (omit to disable)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Optional — Phase 11 SEG routing / deliverability
      SEG_DAILY_CAP_PER_MAILBOX: ${SEG_DAILY_CAP_PER_MAILBOX:-50}
      TRACKING_PIXEL_DOMAIN: ${TRACKING_PIXEL_DOMAIN:-}
      SYSTEM_SEED_ENCRYPTION_KEY: ${SYSTEM_SEED_ENCRYPTION_KEY:-}
      WEBHOOK_DELIVER_CONCURRENCY: ${WEBHOOK_DELIVER_CONCURRENCY:-5}
    # Expose only on internal network (no external ports)
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health/ready', (r) => {if(r.statusCode!==200)throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker service — pg-boss job processor, cron jobs (internal network only).
  worker:
    image: ghcr.io/whrit/quiksend-worker:${QUIKSEND_IMAGE_TAG:-latest}
    container_name: quiksend-worker
    restart: on-failure:3
    networks:
      - db
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://quiksend_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}@postgres:5432/quiksend
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      UNSUBSCRIBE_TOKEN_SECRET: ${UNSUBSCRIBE_TOKEN_SECRET:?UNSUBSCRIBE_TOKEN_SECRET required}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
      NANGO_WEBHOOK_SECRET: ${NANGO_WEBHOOK_SECRET:?NANGO_WEBHOOK_SECRET required}
      MAILBOX_ENCRYPTION_KEY: ${MAILBOX_ENCRYPTION_KEY:?MAILBOX_ENCRYPTION_KEY required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST required in production}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT required in production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
      # Optional — AI generation
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Optional — Phase 11 SEG routing / deliverability
      SEG_DAILY_CAP_PER_MAILBOX: ${SEG_DAILY_CAP_PER_MAILBOX:-50}
      TRACKING_PIXEL_DOMAIN: ${TRACKING_PIXEL_DOMAIN:-}
      SYSTEM_SEED_ENCRYPTION_KEY: ${SYSTEM_SEED_ENCRYPTION_KEY:-}
      WEBHOOK_DELIVER_CONCURRENCY: ${WEBHOOK_DELIVER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test $(find /tmp/worker-ready -mmin -2 2>/dev/null | wc -l) -eq 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quiksend-pgdata-prod:
    driver: local
  quiksend-caddy-data:
    driver: local
  quiksend-caddy-config:
    driver: local
